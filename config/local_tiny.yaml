# Local tiny mode: OSS PySpark + Delta on this machine.
# Uses local_nonatomic_emulation: the SAME publication script is submitted as a plain (NON-ATOMIC)
# SQL compound statement because OSS Spark has no BEGIN ATOMIC. Use it to test SQL shape, SCD2
# semantics, validators and the harness. Results from this mode are never evidence of atomicity;
# every result file produced in this mode is stamped atomicity_evidence=false.
project:
  catalog: local_catalog                 # ignored locally (spark_catalog is used)
  schema_prefix: scd2_bench
  results_root: ./results/runs
  max_estimated_total_rows: 5000000
  max_estimated_storage_gb: 5
compute:
  preferred_mode: local
  transaction_mode: local_nonatomic_emulation
  timezone: UTC
  max_parallel_job_runs: 8
workload:
  table_count: 3
  rows_per_table_per_publication: 200
  publication_count: 3
  dataset_scope_count: 2
  payload_width_bytes: 64
  changed_value_fraction: 0.3
  category_skew: 0.5
  null_fraction: 0.05
strategies: [scd2_full, append_only_full]
formats: [delta, iceberg]               # iceberg cells are expected to be SKIPPED locally (probe-gated)
concurrency:
  launcher: local_process
  writer_counts: [3]
  contention_modes: [same_scope, disjoint_scopes]
  start_modes: [barrier]
  strict_ordering_modes: ['off', sequenced]
  max_attempts: 8
  initial_backoff_ms: 100
  max_backoff_ms: 2000
  per_attempt_timeout_seconds: 300
  overall_deadline_seconds: 600
  barrier_timeout_seconds: 240
  barrier_go_lead_seconds: 2
benchmark:
  repetitions: 1
  warmup_publications: 1
  read_query_repetitions: 2
fault_injection:
  formats: [delta]
  scenarios: [after_first_update, after_first_insert, last_table, after_ledger, duplicate_delivery,
              late_delivery, lost_ack, client_timeout, schema_mismatch, duplicate_keys_input,
              constraint_violation_real]
