# SERVERLESS jobs (default; works on Databricks Free Edition and on paid workspaces with serverless jobs).
# GENERATED by scripts/gen_bundle_jobs.py (edit that, not this file). No YAML anchors.
# Classic job-cluster variant: resources/classic/jobs_classic.yml.
#  * dbxbench_worker     - ONE independent writer. The suite starts N concurrent runs of this job (Jobs API
#                          run-now); each run gets its own serverless compute and Spark session.
#  * dbxbench_suite      - doctor -> init -> generate -> performance -> faults -> contention -> verify -> analyze
#  * dbxbench_live_tests - pytest -m databricks (tests/databricks)
#  * dbxbench_cleanup    - ownership-checked DROP of ONE run's schemas (explicit run; results files are kept)
# Serverless jobs cannot set spark_env_vars or spark_conf: the git sha is passed as --git-sha and the
# live-test settings as KEY=VALUE arguments; the session time zone is set by dbxbench itself.
# Free Edition allows at most 5 concurrent job tasks per account: the suite's own task counts as one, so
# use at most 4 writers (config/free_edition.yaml).
resources:
  jobs:
    dbxbench_worker:
      name: dbxbench-worker-${bundle.target}
      max_concurrent_runs: 100
      parameters:
        - name: plan_path
          default: ""
        - name: writer_id
          default: ""
      tasks:
        - task_key: writer
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-worker
            parameters:
              - --plan
              - "{{job.parameters.plan_path}}"
              - --job-run-id
              - "{{job.run_id}}"
              - --task-run-id
              - "{{task.run_id}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
              - "databricks-sdk>=0.40,<1"

    dbxbench_suite:
      name: dbxbench-suite-${bundle.target}
      max_concurrent_runs: 1
      parameters:
        - name: run_id   # REQUIRED at run time: databricks bundle run dbxbench_suite --params run_id=<id>
          default: ""
      tasks:
        - task_key: doctor
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-task
            parameters: [doctor, --config, "${workspace.file_path}/config/${var.config_file}", --run-id, "{{job.parameters.run_id}}", --catalog, "${var.catalog}", --results-root, "${var.results_root}", --worker-job-id, "${resources.jobs.dbxbench_worker.id}", --git-sha, "${var.git_sha}"]
        - task_key: init
          depends_on: [{task_key: doctor}]
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-task
            parameters: [init, --config, "${workspace.file_path}/config/${var.config_file}", --run-id, "{{job.parameters.run_id}}", --catalog, "${var.catalog}", --results-root, "${var.results_root}", --worker-job-id, "${resources.jobs.dbxbench_worker.id}", --git-sha, "${var.git_sha}"]
        - task_key: generate
          depends_on: [{task_key: init}]
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-task
            parameters: [generate, --config, "${workspace.file_path}/config/${var.config_file}", --run-id, "{{job.parameters.run_id}}", --catalog, "${var.catalog}", --results-root, "${var.results_root}", --worker-job-id, "${resources.jobs.dbxbench_worker.id}", --git-sha, "${var.git_sha}"]
        - task_key: performance
          depends_on: [{task_key: generate}]
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-task
            parameters: [run, --kind, performance, --config, "${workspace.file_path}/config/${var.config_file}", --run-id, "{{job.parameters.run_id}}", --catalog, "${var.catalog}", --results-root, "${var.results_root}", --worker-job-id, "${resources.jobs.dbxbench_worker.id}", --git-sha, "${var.git_sha}"]
        - task_key: faults
          depends_on: [{task_key: performance}]
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-task
            parameters: [run, --kind, fault, --config, "${workspace.file_path}/config/${var.config_file}", --run-id, "{{job.parameters.run_id}}", --catalog, "${var.catalog}", --results-root, "${var.results_root}", --worker-job-id, "${resources.jobs.dbxbench_worker.id}", --git-sha, "${var.git_sha}"]
        - task_key: contention
          depends_on: [{task_key: faults}]
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-task
            parameters: [run, --kind, contention, --config, "${workspace.file_path}/config/${var.config_file}", --run-id, "{{job.parameters.run_id}}", --catalog, "${var.catalog}", --results-root, "${var.results_root}", --worker-job-id, "${resources.jobs.dbxbench_worker.id}", --git-sha, "${var.git_sha}"]
        - task_key: verify
          depends_on: [{task_key: contention}]
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-task
            parameters: [verify, --config, "${workspace.file_path}/config/${var.config_file}", --run-id, "{{job.parameters.run_id}}", --catalog, "${var.catalog}", --results-root, "${var.results_root}", --worker-job-id, "${resources.jobs.dbxbench_worker.id}", --git-sha, "${var.git_sha}"]
        - task_key: analyze
          depends_on: [{task_key: verify}]
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-task
            parameters: [analyze, --config, "${workspace.file_path}/config/${var.config_file}", --run-id, "{{job.parameters.run_id}}", --catalog, "${var.catalog}", --results-root, "${var.results_root}", --worker-job-id, "${resources.jobs.dbxbench_worker.id}", --git-sha, "${var.git_sha}"]
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
              - "databricks-sdk>=0.40,<1"
              - "matplotlib>=3.8,<4"

    dbxbench_live_tests:
      name: dbxbench-live-tests-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: pytest_databricks
          environment_key: default
          spark_python_task:
            python_file: ../scripts/run_live_tests.py
            parameters:
              - "${workspace.file_path}"
              - DBXBENCH_DATABRICKS_TESTS=1
              - "DBXBENCH_CATALOG=${var.catalog}"
              - "DBXBENCH_RESULTS_ROOT=${var.results_root}"
              - "DBXBENCH_GIT_SHA=${var.git_sha}"
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
              - "pytest>=8"

    dbxbench_cleanup:
      name: dbxbench-cleanup-${bundle.target}
      max_concurrent_runs: 1
      parameters:
        - name: run_id                     # REQUIRED: exactly one run id, no wildcards
          default: ""
        - name: schema_prefix              # scd2_bench for suite runs, dbxbench_live for live-test runs
          default: scd2_bench
        - name: discard_failure_evidence   # yes = also drop tables of FAILED cells
          default: "no"
      tasks:
        - task_key: cleanup
          environment_key: default
          python_wheel_task:
            package_name: dbxbench
            entry_point: dbxbench-task
            parameters: [cleanup, --config, "${workspace.file_path}/config/${var.config_file}",
                         --run-id, "{{job.parameters.run_id}}", --catalog, "${var.catalog}",
                         --results-root, "${var.results_root}", --schema-prefix, "{{job.parameters.schema_prefix}}",
                         --discard-failure-evidence, "{{job.parameters.discard_failure_evidence}}", --yes]
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - "../dist/*.whl"
